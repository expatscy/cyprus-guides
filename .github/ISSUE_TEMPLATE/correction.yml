name: Correction
description: A fact in a guide is wrong or outdated
labels: [correction]
body:
  - type: input
    id: page
    attributes:
      label: Page URL or file path
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: What the guide says and what is correct
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Official source URL
    validations:
      required: true
  - type: input
    id: checked
    attributes:
      label: Date you checked the source (YYYY-MM-DD)
    validations:
      required: true
